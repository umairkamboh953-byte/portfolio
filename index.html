    <!-- Error shield for cross-origin third-party script notifications -->
    <script>
      window.addEventListener('error', function(event) {
        if (!event || event.message === 'Script error.' || (event.filename && (event.filename.indexOf('bpcontent.cloud') !== -1 || event.filename.indexOf('botpress.cloud') !== -1))) {
          if (event.preventDefault) event.preventDefault();
          return true;
        }
      });
      // Defensive Botpress stub so that any early calls to window.botpress.init never throw a TypeError
      window.botpress = window.botpress || {
        _queue: [],
        init: function(cfg) {
          this._pendingConfig = cfg;
        },
        open: function() {
          this._queue.push(['open']);
        },
        close: function() {
          this._queue.push(['close']);
        },
        toggle: function() {
          this._queue.push(['toggle']);
        }
      };
    </script>
    <!-- Botpress Webchat core engine (must load so window.botpress is fully initialized) -->
    <script src="https://cdn.botpress.cloud/webchat/v5.0/inject.js"></script>
    <!-- Botpress Webchat config bundle -->
    <script src="https://files.bpcontent.cloud/2026/10/14/05/20261014051227-28N8EKMJ.js" defer></script>
    <script>
      window.addEventListener('DOMContentLoaded', function() {
        try {
          if (window.botpress && window.botpress._pendingConfig && typeof window.botpress.init === 'function') {
            window.botpress.init(window.botpress._pendingConfig);
            delete window.botpress._pendingConfig;
          }
        } catch (e) {
          console.warn('Botpress initialization handled:', e);
        }
      });
    </script>

  <body>
